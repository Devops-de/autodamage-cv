[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "C901",  # McCabe cyclomatic complexity
    "UP",    # pyupgrade
    "BLE",   # blind exception catches
    "DTZ",   # timezone-aware datetimes
    "PIE",   # unnecessary pass/placeholders
    "RET504",# unnecessary assign before return
    "RET505",# unnecessary elif after return
    "RUF012",# ClassVar on mutable class defaults
    "S104",  # hardcoded bind to all interfaces
]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # FastAPI Depends/File/Form in default arguments
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
