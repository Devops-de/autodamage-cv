name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Automated Tests & Quality Checks
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies for OpenCV
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libglib2.0-0 libgl1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff static analysis & code style
        run: |
          ruff check .
          ruff format --check .

      - name: Generate synthetic test samples
        run: |
          python generate_samples.py

      - name: Run Pytest test suite
        run: |
          pytest -v

      - name: Verify CLI interface
        run: |
          python cli.py list-panels
          python cli.py inspect app/static/sample_images/sample_bumper_scratch.jpg --panel FRONT_BUMPER
